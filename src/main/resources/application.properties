# ================================
# Server
# ================================
server.port=8080

# ================================
# MongoDB
# ================================
spring.data.mongodb.uri=mongodb://localhost:27017/letsplay
spring.data.mongodb.database=letsplay

# ================================
# JWT
# ================================
app.jwt.secret=${JWT_SECRET:7f8a9b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ================================
# App
# ================================
spring.application.name=lets-play

# ================================
# Encoding
# ================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true